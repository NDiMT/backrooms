name: Build Android APK

on:
  push:
    branches:
      - claude/liminal-space-game-smnwr0
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # μόνο τα απαραίτητα — το default κατεβάζει και emulator,
          # που είναι άχρηστο για assembleDebug και επιρρεπές σε flaky downloads
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle (www/)
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Force portrait orientation
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorPortrait"/' \
            android/app/src/main/AndroidManifest.xml
          grep -q 'sensorPortrait' android/app/src/main/AndroidManifest.xml

      - name: Generate app icon & splash (best effort)
        run: |
          npx --yes @capacitor/assets generate --android \
            --assetPath resources || echo "icon generation skipped"

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             dist/driftland.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: driftland-apk
          path: dist/driftland.apk
          if-no-files-found: error

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # απομεινάρι του προηγούμενου παιχνιδιού στο ίδιο release tag
          gh release delete-asset android-latest nekri-zoni.apk \
            --repo "$GITHUB_REPOSITORY" --yes || true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: DRIFTLAND — Android (latest)
          body: |
            Automatically built APK of DRIFTLAND — a castaway island
            survival-crafting game.

            Download `driftland.apk` below and install it on Android
            (allow "install from unknown sources").
          files: dist/driftland.apk
          make_latest: true
