name: Build Android APK

on:
  push:
    branches:
      - claude/liminal-space-game-smnwr0
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web bundle (www/)
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             dist/the-backrooms-level0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-backrooms-level0-apk
          path: dist/the-backrooms-level0.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: The Backrooms — Android (latest)
          body: |
            Αυτόματα χτισμένο APK του The Backrooms — Level 0.

            Κατέβασε το `the-backrooms-level0.apk` παρακάτω και εγκατέστησέ το
            στο Android (χρειάζεται να επιτρέψεις εγκατάσταση από «άγνωστες πηγές»).
          files: dist/the-backrooms-level0.apk
          make_latest: true
