<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DEEPER — Idle Descent</title>
<style>
  @font-face {
    font-family: 'Press Start 2P';
    src: url('fonts/press-start-2p.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'VT323';
    src: url('fonts/vt323.woff2') format('woff2');
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0c0a06;
    font-family: 'VT323', monospace;
    color: #e8e4d8;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }

  #game {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#screen { image-rendering: pixelated; background: #16130c; }

  /* -------- HUD -------- */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  #hud > * { pointer-events: auto; }

  .bars {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 10px;
    width: 120px; pointer-events: none;
  }
  .bar {
    height: 12px; margin-bottom: 5px;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.25);
    position: relative;
  }
  .bar .fill { position: absolute; inset: 1px; transform-origin: left; }
  #hp-fill { background: linear-gradient(#e85040, #b02818); width: 100%; }
  .bar .ico {
    position: absolute; left: -2px; top: -3px; font-size: 11px;
    text-shadow: 1px 1px 0 #000;
  }

  #floor-label {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 10px;
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    color: #ffe86a; text-shadow: 1px 1px 0 #000;
    text-align: right; pointer-events: none;
  }
  #run-loot {
    position: absolute; top: calc(24px + env(safe-area-inset-top)); right: 10px;
    font-size: 19px; color: #e8e4d8; text-shadow: 1px 1px 0 #000;
    text-align: right; pointer-events: none;
  }
  #run-loot .core { color: #c88aff; }

  #hint {
    position: absolute; top: calc(48px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    max-width: 84%;
    font-size: 17px; color: #d8d0a8; text-align: center;
    text-shadow: 1px 1px 0 #000;
    pointer-events: none;
  }

  #toast {
    position: absolute; top: 26%; left: 50%; transform: translateX(-50%);
    max-width: 86%;
    font-size: 19px; color: #fff; text-align: center;
    text-shadow: 1px 1px 0 #000, 0 0 12px rgba(0,0,0,0.7);
    opacity: 0; transition: opacity 0.25s;
    pointer-events: none;
  }

  /* κουμπιά δεξιά */
  #act-btn {
    position: absolute; right: 18px; bottom: calc(30px + env(safe-area-inset-bottom));
    min-width: 0; padding: 0; margin: 0;
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255, 232, 106, 0.14);
    border: 3px solid rgba(255, 232, 106, 0.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }
  #act-btn:active { background: rgba(255, 232, 106, 0.35); }
  .side-btn {
    position: absolute; width: 52px; height: 52px; border-radius: 50%;
    min-width: 0; padding: 0; margin: 0;
    background: rgba(30, 26, 16, 0.75);
    border: 2px solid rgba(220, 210, 170, 0.55);
    color: #f0ecd8;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    text-shadow: 1px 1px 0 #000;
  }
  #pause-btn { left: 12px; top: calc(34px + env(safe-area-inset-top));
    width: 34px; height: 34px; font-size: 12px; }

  /* joystick */
  #joy-zone { position: absolute; left: 0; bottom: 0; width: 55%; height: 46%; }
  #joy-base {
    position: fixed; width: 100px; height: 100px; border-radius: 50%;
    background: rgba(240, 230, 200, 0.08);
    border: 2px solid rgba(240, 230, 200, 0.3);
    pointer-events: none;
  }
  #joy-stick {
    position: absolute; left: 50%; top: 50%;
    width: 44px; height: 44px; margin: -22px;
    border-radius: 50%;
    background: rgba(240, 230, 200, 0.35);
  }
  body:not(.touch-mode) #joy-zone { display: none; }
  body:not(.touch-mode) #act-btn,
  body:not(.touch-mode) .side-btn { opacity: 0.85; }

  /* -------- overlays / panels -------- */
  .overlay {
    position: absolute; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 20px;
    background: rgba(10, 8, 4, 0.94);
  }
  .hidden { display: none !important; }

  #title {
    background:
      linear-gradient(rgba(10, 8, 4, 0.3), rgba(10, 8, 4, 0.75)),
      #16130c;
    background-size: cover; background-position: center;
    image-rendering: pixelated;
  }
  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(26px, 9vmin, 46px);
    color: #ffe86a;
    text-shadow: 3px 3px 0 #5a4a10, 6px 6px 0 rgba(0, 0, 0, 0.7);
    margin-bottom: 6px; letter-spacing: 0.04em;
  }
  .sub {
    font-family: 'Press Start 2P', monospace; font-size: 8px;
    letter-spacing: 0.3em; opacity: 0.75; margin-bottom: 26px;
    text-shadow: 1px 1px 0 #000;
  }
  h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 4.5vmin, 22px);
    color: #ffe86a; text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
    margin-bottom: 14px;
  }
  button {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px; letter-spacing: 0.05em;
    color: #e8e4d8; background: #3a3218;
    border: 0;
    border-top: 3px solid #6a5c2c; border-left: 3px solid #6a5c2c;
    border-bottom: 3px solid #16120a; border-right: 3px solid #16120a;
    padding: 14px 22px; margin: 6px;
    cursor: pointer; min-width: 230px;
  }
  button:active { transform: translate(1px, 1px); }
  button.primary { background: #6a5410; border-top-color: #a8892c;
    border-left-color: #a8892c; border-bottom-color: #2a220a;
    border-right-color: #2a220a; color: #fff2c0; }
  button.ad { background: #2c4a5a; border-top-color: #55809a;
    border-left-color: #55809a; border-bottom-color: #101e26;
    border-right-color: #101e26; color: #d8f0ff; }
  button:disabled { opacity: 0.45; }

  /* -------- hub -------- */
  #hub {
    justify-content: flex-start;
    overflow-y: auto;
    padding-top: calc(18px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  #hub h2 { margin-top: 4px; }
  #hub-bank {
    font-size: 22px; margin-bottom: 2px;
  }
  #hub-bank .core { color: #c88aff; }
  #hub-sub { font-size: 16px; opacity: 0.8; margin-bottom: 12px; }
  #hub .actions button { display: block; width: min(320px, 86vw); }
  #up-head {
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    color: #d8c888; margin: 16px 0 8px;
  }
  #upgrade-list { width: min(430px, 100%); text-align: left; }
  .up-row {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.12);
    padding: 8px; margin-bottom: 6px;
  }
  .up-row .ic { font-size: 24px; width: 32px; text-align: center; }
  .up-row .ci { flex: 1; display: flex; flex-direction: column; }
  .up-row .ci b { font-size: 18px; }
  .up-row .ci b small { opacity: 0.7; font-weight: normal; }
  .up-row .ci .d { font-size: 14px; opacity: 0.8; }
  .up-row button { min-width: 92px; padding: 10px 8px; margin: 0; font-size: 8px; }
  .up-row.maxed { opacity: 0.6; }
  #hub-stats { font-size: 15px; opacity: 0.7; margin-top: 14px; }

  .panel {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: min(430px, 100%);
    max-height: 72%;
    z-index: 25;
    background: rgba(20, 16, 8, 0.96);
    border-top: 3px solid #6a5c2c;
    padding: 12px 12px calc(16px + env(safe-area-inset-bottom));
    overflow-y: auto;
    text-align: center;
  }
  .panel h3 {
    font-family: 'Press Start 2P', monospace; font-size: 10px;
    color: #ffe86a; margin: -12px -12px 10px; padding: 12px;
    background: rgba(20, 16, 8, 0.98);
  }
  .panel button { display: block; margin: 6px auto; width: min(320px, 92%); }
  #elev-info { font-size: 18px; margin-bottom: 8px; }

  .stats { font-size: 19px; line-height: 1.5; margin-bottom: 14px; }

  #daily-grid { font-size: 30px; letter-spacing: 3px; margin: 6px 0 10px; }

  #ad-stub {
    position: absolute; inset: 0; z-index: 60;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    font-family: 'Press Start 2P', monospace; font-size: 11px; color: #9fd0ff;
  }
  #ad-stub small { font-size: 8px; opacity: 0.6; }

  /* scanlines για ρετρό υφή */
  #scan {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background: repeating-linear-gradient(0deg,
      rgba(0, 0, 0, 0.09) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <div id="game"><canvas id="screen" width="288" height="512"></canvas></div>
  <div id="scan"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="bars">
      <div class="bar"><span class="ico">❤</span><div class="fill" id="hp-fill"></div></div>
    </div>
    <div id="floor-label">FLOOR 1</div>
    <div id="run-loot">⚙ 0</div>
    <button id="pause-btn" class="side-btn">II</button>
    <div id="hint"></div>
    <div id="toast"></div>

    <div id="joy-zone"></div>
    <div id="joy-base" class="hidden"><div id="joy-stick"></div></div>
    <button id="act-btn"><span id="act-icon">✊</span></button>
  </div>

  <!-- PANELS -->
  <div id="elev-panel" class="panel hidden">
    <h3>🛗 ELEVATOR</h3>
    <div id="elev-info"></div>
    <button class="primary" id="elev-deeper">⬇ GO DEEPER</button>
    <button id="elev-cashout"></button>
    <button class="ad" id="elev-cashout2"></button>
  </div>

  <div id="pause-panel" class="panel hidden">
    <h3>PAUSED</h3>
    <button class="primary" id="resume-btn">RESUME</button>
    <button id="abandon-btn">ABANDON RUN (KEEP 40%)</button>
  </div>

  <!-- OVERLAYS -->
  <div id="title" class="overlay">
    <h1>DEEPER</h1>
    <div class="sub">THE ONLY WAY OUT IS DOWN</div>
    <button class="primary" id="enter-btn">ENTER</button>
  </div>

  <div id="hub" class="overlay hidden">
    <h2>THE SURFACE</h2>
    <div id="hub-bank">⚙ 0 · <span class="core">◆ 0</span></div>
    <div id="hub-sub"></div>
    <div class="actions">
      <button class="primary" id="descend-btn">⬇ DESCEND</button>
      <button id="daily-btn">📅 DAILY FLOOR</button>
    </div>
    <div id="up-head">UPGRADES</div>
    <div id="upgrade-list"></div>
    <div id="hub-stats"></div>
  </div>

  <div id="offline" class="overlay hidden">
    <h2>WHILE YOU WERE AWAY…</h2>
    <p class="stats">Your scavenger drones brought back<br>
      <b id="offline-amt" style="font-size:26px">0</b> ⚙ scrap</p>
    <button class="ad" id="offline-claim2">📺 CLAIM ×2 (AD)</button>
    <button id="offline-claim">CLAIM</button>
  </div>

  <div id="dead" class="overlay hidden">
    <h2>THE DARK TAKES YOU</h2>
    <p class="stats" id="dead-info"></p>
    <button class="ad" id="revive-btn">📺 REVIVE (AD) — KEEP YOUR SCRAP</button>
    <button id="giveup-btn">GIVE UP — KEEP 40%</button>
  </div>

  <div id="daily-result" class="overlay hidden">
    <h2>DAILY FLOOR</h2>
    <div id="daily-grid"></div>
    <p class="stats" id="daily-score-line"></p>
    <button class="primary" id="share-btn">📣 SHARE</button>
    <button id="daily-close">BACK TO SURFACE</button>
  </div>

  <!-- Ad stub (προσομοίωση rewarded ad μέχρι να μπει πραγματικό SDK) -->
  <div id="ad-stub" class="hidden">
    <div>AD PLAYING…</div>
    <div id="ad-stub-count">3</div>
    <small>(simulated rewarded ad)</small>
  </div>

  <script src="js/defs.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/world.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/monetize.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
