<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DRIFTLAND — Island Survival</title>
<style>
  @font-face {
    font-family: 'Press Start 2P';
    src: url('fonts/press-start-2p.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'VT323';
    src: url('fonts/vt323.woff2') format('woff2');
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a1520;
    font-family: 'VT323', monospace;
    color: #e8e4d8;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }

  #game {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#screen { image-rendering: pixelated; background: #14324a; }

  /* -------- HUD -------- */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  #hud > * { pointer-events: auto; }

  .bars {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 10px;
    width: 130px; pointer-events: none;
  }
  .bar {
    height: 12px; margin-bottom: 5px;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.25);
    position: relative;
  }
  .bar .fill { position: absolute; inset: 1px; transform-origin: left; }
  #hp-fill { background: linear-gradient(#e85040, #b02818); width: 100%; }
  #food-fill { background: linear-gradient(#e8a040, #b07018); width: 100%; }
  .bar .ico {
    position: absolute; left: -2px; top: -3px; font-size: 11px;
    text-shadow: 1px 1px 0 #000;
  }

  #day-label {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 10px;
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    color: #ffe9b0; text-shadow: 1px 1px 0 #000;
    pointer-events: none;
  }

  #hint {
    position: absolute; top: calc(46px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    max-width: 84%;
    font-size: 17px; color: #cfe8c0; text-align: center;
    text-shadow: 1px 1px 0 #000;
    pointer-events: none;
  }

  #toast {
    position: absolute; top: 26%; left: 50%; transform: translateX(-50%);
    max-width: 86%;
    font-size: 19px; color: #fff; text-align: center;
    text-shadow: 1px 1px 0 #000, 0 0 12px rgba(0,0,0,0.7);
    opacity: 0; transition: opacity 0.25s;
    pointer-events: none;
  }

  /* κουμπιά δεξιά */
  #act-btn {
    position: absolute; right: 18px; bottom: calc(30px + env(safe-area-inset-bottom));
    min-width: 0; padding: 0; margin: 0;
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255, 232, 170, 0.14);
    border: 3px solid rgba(255, 232, 170, 0.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }
  #act-btn:active { background: rgba(255, 232, 170, 0.35); }
  .side-btn {
    position: absolute; width: 52px; height: 52px; border-radius: 50%;
    min-width: 0; padding: 0; margin: 0;
    background: rgba(20, 32, 46, 0.75);
    border: 2px solid rgba(200, 220, 240, 0.55);
    color: #eef4fa;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    text-shadow: 1px 1px 0 #000;
  }
  #inv-btn { right: 24px; bottom: calc(136px + env(safe-area-inset-bottom)); }
  #craft-btn { right: 86px; bottom: calc(112px + env(safe-area-inset-bottom)); }
  #torch-btn { right: 122px; bottom: calc(38px + env(safe-area-inset-bottom)); font-size: 18px; }
  #torch-btn.on { background: rgba(255, 180, 60, 0.4); border-color: #ffb43c; }
  #pause-btn { left: 12px; top: calc(34px + env(safe-area-inset-top));
    width: 34px; height: 34px; font-size: 12px; }

  /* joystick */
  #joy-zone { position: absolute; left: 0; bottom: 0; width: 55%; height: 46%; }
  #joy-base {
    position: fixed; width: 100px; height: 100px; border-radius: 50%;
    background: rgba(220, 230, 240, 0.08);
    border: 2px solid rgba(220, 230, 240, 0.3);
    pointer-events: none;
  }
  #joy-stick {
    position: absolute; left: 50%; top: 50%;
    width: 44px; height: 44px; margin: -22px;
    border-radius: 50%;
    background: rgba(220, 230, 240, 0.35);
  }
  body:not(.touch-mode) #joy-zone { display: none; }
  body:not(.touch-mode) #act-btn,
  body:not(.touch-mode) .side-btn { opacity: 0.85; }

  /* -------- overlays / panels -------- */
  .overlay {
    position: absolute; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 20px;
    background: rgba(8, 12, 20, 0.92);
  }
  .hidden { display: none !important; }

  #title {
    background:
      linear-gradient(rgba(8, 12, 20, 0.25), rgba(8, 12, 20, 0.6)),
      #14324a;
    background-size: cover; background-position: center;
    image-rendering: pixelated;
  }
  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(24px, 8vmin, 42px);
    color: #ffe9b0;
    text-shadow: 3px 3px 0 #7a4a18, 6px 6px 0 rgba(0, 0, 0, 0.6);
    margin-bottom: 6px; letter-spacing: 0.04em;
  }
  .sub {
    font-family: 'Press Start 2P', monospace; font-size: 8px;
    letter-spacing: 0.3em; opacity: 0.75; margin-bottom: 26px;
    text-shadow: 1px 1px 0 #000;
  }
  h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 4.5vmin, 22px);
    color: #ffe9b0; text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
    margin-bottom: 14px;
  }
  button {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px; letter-spacing: 0.05em;
    color: #e8e4d8; background: #1d3145;
    border: 0;
    border-top: 3px solid #3d5a75; border-left: 3px solid #3d5a75;
    border-bottom: 3px solid #0c1622; border-right: 3px solid #0c1622;
    padding: 14px 22px; margin: 6px;
    cursor: pointer; min-width: 220px;
  }
  button:active { transform: translate(1px, 1px); }
  button.primary { background: #2c5a2e; border-top-color: #55915a;
    border-left-color: #55915a; border-bottom-color: #12280f;
    border-right-color: #12280f; color: #eaffdf; }
  button:disabled { opacity: 0.45; }

  .panel {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: min(430px, 100%);
    max-height: 72%;
    z-index: 25;
    background: rgba(16, 24, 34, 0.96);
    border-top: 3px solid #3d5a75;
    padding: 12px 12px calc(16px + env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .panel h3 {
    font-family: 'Press Start 2P', monospace; font-size: 10px;
    color: #ffe9b0; margin: -12px -12px 10px; padding: 12px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: -12px; z-index: 2;
    background: rgba(16, 24, 34, 0.98);
  }
  .panel h3 button { min-width: 0; padding: 8px 12px; margin: 0; font-size: 9px; }

  .grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    margin-bottom: 8px;
  }
  .slot {
    aspect-ratio: 1; background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(255, 255, 255, 0.18);
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .slot img { width: 70%; height: 70%; image-rendering: pixelated; }
  .slot .n {
    position: absolute; right: 3px; bottom: 1px;
    font-size: 15px; color: #ffe9b0; text-shadow: 1px 1px 0 #000;
  }
  .slot.empty { opacity: 0.5; }
  .panel small.note { font-size: 15px; opacity: 0.7; }

  .craft-head {
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    color: #9fd0ff; margin: 10px 0 6px;
  }
  .craft-row {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.12);
    padding: 7px; margin-bottom: 6px;
  }
  .craft-row img { width: 36px; height: 36px; image-rendering: pixelated; }
  .craft-row .ci { flex: 1; display: flex; flex-direction: column; }
  .craft-row .ci b { font-size: 18px; }
  .craft-row .ci small { font-size: 14px; opacity: 0.8; }
  .craft-row .ci small .ok { color: #9fe09f; }
  .craft-row .ci small .no { color: #e09f9f; }
  .craft-row button { min-width: 0; padding: 10px 12px; margin: 0; font-size: 8px; }
  .craft-row.disabled { opacity: 0.55; }

  #raft-panel { text-align: center; }
  #raft-stage { font-size: 20px; color: #ffe9b0; margin-bottom: 6px; }
  #raft-cost { font-size: 16px; margin-bottom: 10px; }
  #raft-cost .ok { color: #9fe09f; } #raft-cost .no { color: #e09f9f; }

  #ad-stub {
    position: absolute; inset: 0; z-index: 60;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    font-family: 'Press Start 2P', monospace; font-size: 11px; color: #9fd0ff;
  }
  #ad-stub small { font-size: 8px; opacity: 0.6; }

  .stats { font-size: 19px; line-height: 1.5; margin-bottom: 14px; }

  /* scanlines για ρετρό υφή */
  #scan {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background: repeating-linear-gradient(0deg,
      rgba(0, 0, 0, 0.09) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <div id="game"><canvas id="screen" width="288" height="512"></canvas></div>
  <div id="scan"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="bars">
      <div class="bar"><span class="ico">❤</span><div class="fill" id="hp-fill"></div></div>
      <div class="bar"><span class="ico">🍖</span><div class="fill" id="food-fill"></div></div>
    </div>
    <div id="day-label">DAY 1 ☀</div>
    <button id="pause-btn" class="side-btn">II</button>
    <div id="hint"></div>
    <div id="toast"></div>

    <div id="joy-zone"></div>
    <div id="joy-base" class="hidden"><div id="joy-stick"></div></div>
    <button id="act-btn"><span id="act-icon">✊</span></button>
    <button id="inv-btn" class="side-btn">INV</button>
    <button id="craft-btn" class="side-btn">CRAFT</button>
    <button id="torch-btn" class="side-btn hidden">🔥</button>
  </div>

  <!-- PANELS -->
  <div id="inv-panel" class="panel hidden">
    <h3>BACKPACK <button id="inv-close">CLOSE</button></h3>
    <div class="grid" id="inv-grid"></div>
    <small class="note" id="inv-hint"></small>
  </div>

  <div id="craft-panel" class="panel hidden">
    <h3>CRAFTING <button id="craft-close">CLOSE</button></h3>
    <div id="craft-list"></div>
  </div>

  <div id="chest-panel" class="panel hidden">
    <h3>CHEST <button id="chest-close">CLOSE</button></h3>
    <div class="grid" id="chest-grid"></div>
    <small class="note">Your backpack — tap to store:</small>
    <div class="grid" id="chest-inv-grid"></div>
  </div>

  <div id="raft-panel" class="panel hidden">
    <h3>ESCAPE RAFT <button id="raft-close">CLOSE</button></h3>
    <div id="raft-stage"></div>
    <div id="raft-cost"></div>
    <button class="primary" id="raft-build-btn">BUILD</button>
    <button class="primary hidden" id="raft-sail-btn">⛵ SAIL AWAY</button>
  </div>

  <div id="pause-panel" class="panel hidden">
    <h3>PAUSED</h3>
    <button class="primary" id="resume-btn">RESUME</button>
    <button id="savequit-btn">SAVE & QUIT</button>
  </div>

  <!-- OVERLAYS -->
  <div id="title" class="overlay">
    <h1>DRIFTLAND</h1>
    <div class="sub">ISLAND SURVIVAL</div>
    <button class="primary" id="start-btn">NEW GAME</button>
    <button id="continue-btn" class="hidden">CONTINUE</button>
  </div>

  <div id="dead" class="overlay hidden">
    <h2>YOU COLLAPSED</h2>
    <p class="stats">Your belongings dropped where you fell.</p>
    <button class="primary" id="revive-btn">📺 RESCUE FLARE (AD) — REVIVE HERE</button>
    <button id="respawn-btn">RESPAWN AT CAMP</button>
  </div>

  <div id="win" class="overlay hidden">
    <h2>YOU ESCAPED!</h2>
    <p class="stats" id="win-stats"></p>
    <button class="primary" id="win-new-btn">NEW ISLAND</button>
  </div>

  <!-- Ad stub (προσομοίωση rewarded ad μέχρι να μπει πραγματικό SDK) -->
  <div id="ad-stub" class="hidden">
    <div>AD PLAYING…</div>
    <div id="ad-stub-count">3</div>
    <small>(simulated rewarded ad)</small>
  </div>

  <script src="js/defs.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/world.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/monetize.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
